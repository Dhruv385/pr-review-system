<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Review Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- ===================== AUTH VIEW ===================== -->
  <section id="auth-view" class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">PR Review</span>
      </div>
      <p class="auth-subtitle">Track pull requests and reviews across GitHub &amp; GitLab, with AI-assisted review on demand.</p>

      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="login" type="button">Log in</button>
        <button class="tab" data-tab="register" type="button">Register</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Email
          <input type="email" name="email" required autocomplete="username" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Email
          <input type="email" name="email" required autocomplete="username" />
        </label>
        <label>Password
          <input type="password" name="password" required minlength="8" autocomplete="new-password" />
          <span class="hint">Minimum 8 characters</span>
        </label>
        <label>Platform
          <select name="platform" required>
            <option value="GITHUB">GitHub</option>
            <option value="GITLAB">GitLab</option>
          </select>
        </label>
        <label>Platform username
          <input type="text" name="username" required placeholder="e.g. octocat" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p id="auth-error" class="form-error hidden"></p>
    </div>
  </section>

  <!-- ===================== APP VIEW ===================== -->
  <section id="app-view" class="app-shell hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">PR Review</span>
      </div>
      <div class="topbar-actions">
        <button id="connect-github" class="btn btn-ghost" type="button">
          <span class="dot dot-github"></span> Connect GitHub
        </button>
        <button id="connect-gitlab" class="btn btn-ghost" type="button">
          <span class="dot dot-gitlab"></span> Connect GitLab
        </button>
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="btn btn-outline" type="button">Log out</button>
      </div>
    </header>

    <div id="toast" class="toast hidden"></div>

    <main class="content">
      <div class="content-header">
        <h1>Pull Requests</h1>
        <div class="filters">
          <button class="chip active" data-platform="">All</button>
          <button class="chip" data-platform="GITHUB">GitHub</button>
          <button class="chip" data-platform="GITLAB">GitLab</button>
          <button id="refresh-btn" class="btn btn-outline btn-sm" type="button">Refresh</button>
        </div>
      </div>

      <div id="pr-empty" class="empty-state hidden">
        <p>No pull requests yet.</p>
        <p class="muted">Connect a GitHub or GitLab account above to sync your PRs.</p>
      </div>

      <div id="pr-loading" class="loading-state">Loading pull requests…</div>

      <div id="pr-grid" class="pr-grid"></div>
    </main>
  </section>

  <!-- ===================== PR DETAIL PANEL ===================== -->
  <div id="detail-overlay" class="overlay hidden">
    <aside id="detail-panel" class="detail-panel">
      <button id="detail-close" class="btn-close" type="button" aria-label="Close">✕</button>
      <div id="detail-content"></div>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
